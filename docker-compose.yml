services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////data/billing.db
      - CORS_ORIGINS=http://localhost,http://localhost:80
    volumes:
      - billing_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  billing_data:
